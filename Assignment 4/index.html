
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Commerce Website</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript File -->
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container mt-4">

        <h2 class="text-center mb-4">My E-Commerce Store</h2>

        <div class="row">

            <div class="col-md-8">
                <div class="row" id="productList"></div>
            </div>

            <div class="col-md-4">
                <div class="cart-box">
                    <h3>Shopping Cart</h3>

                    <div id="cartItems">
                        Your cart is empty.
                    </div>

                    <hr>

                    <h5 id="grandTotal">Grand Total: ₹0</h5>
                    <button
    class="btn btn-success w-100 mt-3"
    id="checkoutBtn"
    onclick="proceedToCheckout()"
    disabled
>
    Proceed to Checkout
</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
